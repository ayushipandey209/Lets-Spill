name: let_s_spill
description: "Let's Spill — Your secrets. Their stories. A text-only anonymous confession journal."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  # Firebase (official FlutterFire SDKs — no custom backend)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  google_sign_in: ^7.2.0

  # Platform share sheet
  share_plus: ^12.0.0

  # On-device persistence for likes, reactions, saves and own posts
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mock/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
        - asset: assets/fonts/Figtree-Italic-VariableFont_wght.ttf
          style: italic
